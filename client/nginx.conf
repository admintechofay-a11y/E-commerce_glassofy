server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 1. Gzip Compression for Blazing Fast Asset Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # 2. Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 3. Let's Encrypt SSL ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 4. Long-Lived Static Asset Caching (Vite hashed bundles)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|svg|png|jpg|jpeg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 5. Reverse Proxy for Backend API
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15M;
    }

    # 6. Proxy Image Storage
    location /images/ {
        proxy_pass http://server:5000/images/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 7. Dynamic SEO Routes (sitemap.xml & robots.txt)
    location = /sitemap.xml {
        proxy_pass http://server:5000/sitemap.xml;
        proxy_set_header Host $host;
    }

    location = /robots.txt {
        proxy_pass http://server:5000/robots.txt;
        proxy_set_header Host $host;
    }

    # 8. Single Page Application (SPA) Client-Side Route Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
